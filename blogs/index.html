<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prakhar's Blogs - Essays and Experiments</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Essays and experiments on AI, machine learning, agentic systems, Computer use agents, and software engineering by Prakhar Jain.">
    <meta name="keywords" content="AI blog, machine learning, agentic systems, software engineering, evaluation frameworks">
    <meta name="author" content="Prakhar Jain">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
        }

        .header {
            padding: 60px 0 40px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 32px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .back-link i {
            font-size: 12px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-muted);
        }

        .posts {
            margin-top: 40px;
        }

        .post-item {
            padding: 24px 0;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s;
        }

        .post-item:first-child {
            padding-top: 0;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .post-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.4;
            transition: color 0.2s;
        }

        .post-link:hover .post-title {
            color: var(--accent);
        }

        .post-date {
            font-size: 14px;
            color: var(--text-muted);
        }

        footer {
            padding: 40px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
            margin-top: 80px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 40px 0 30px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 15px;
            }

            .post-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
            <h1>Prakhar's Blogs</h1>
            <p class="subtitle">Essays and experiments</p>
        </div>

        <div class="posts">
            <article class="post-item">
                <a href="Evals%20Blog/EvalsBlog.html" class="post-link">
                    <h2 class="post-title">The Evaluation Imperative: Building Robust Agentic Applications</h2>
                    <time class="post-date" datetime="2026-01-19">January 19, 2026</time>
                </a>
            </article>
        </div>
    </div>

    <footer>
        <p>© 2024 Prakhar Jain. All rights reserved.</p>
    </footer>
</body>
</html>
